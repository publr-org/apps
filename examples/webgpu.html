<!doctype html>
<canvas id=c width=200 height=200></canvas>
<script>
const say = t => webkit.messageHandlers.native.postMessage(t);
(async () => {
  try {
    say("secure context: " + isSecureContext + ", navigator.gpu: " + !!navigator.gpu);
    if (!navigator.gpu) return say("done: no WebGPU");
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return say("done: no adapter");
    const device = await adapter.requestDevice();
    const ctx = document.getElementById("c").getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device, format });
    const mod = device.createShaderModule({ code: `
      @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array<vec2f, 3>(vec2f(0, .8), vec2f(-.8, -.8), vec2f(.8, -.8));
        return vec4f(p[i], 0, 1);
      }
      @fragment fn fs() -> @location(0) vec4f { return vec4f(.06, .46, .43, 1); }` });
    const pipeline = device.createRenderPipeline({ layout: "auto",
      vertex: { module: mod, entryPoint: "vs" },
      fragment: { module: mod, entryPoint: "fs", targets: [{ format }] } });
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(),
      loadOp: "clear", storeOp: "store", clearValue: [1, 1, 1, 1] }] });
    pass.setPipeline(pipeline); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    const errors = [];
    device.onuncapturederror = e => errors.push(e.error.message);
    say("adapter: " + (adapter.info ? adapter.info.vendor + " " + adapter.info.architecture : "?") +
        ", features: " + [...adapter.features].length + ", maxBufferSize: " + adapter.limits.maxBufferSize);
    say("done: WebGPU works, frame drawn" + (errors.length ? " with errors: " + errors.join("; ") : ""));
  } catch (e) { say("done: failed: " + e); }
})();
</script>
